name: Release

# Tag `vX.Y.Z` -> build -> full suite -> `npm publish --provenance`.
#
# Publishing is DISABLED until 0.1.0 is cut deliberately: the dry-run step
# always runs (so the tarball, provenance wiring and registry auth are
# exercised on every tag), the real publish runs only when the repository
# variable PUBLISH_ENABLED is set to "true". Flip it in Settings -> Secrets
# and variables -> Actions -> Variables when 0.1.0 is ready; the tag must
# also match package.json's version.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance (Sigstore) needs an OIDC token

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Publish (dry run, always)
        run: npm publish --provenance --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: vars.PUBLISH_ENABLED == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
