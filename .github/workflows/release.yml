name: Release

# Tag `vX.Y.Z` -> build -> full suite -> `npm publish --provenance`.
#
# Auth is OIDC Trusted Publishing (configured on npmjs.com for this repo +
# this workflow file): npm mints a short-lived credential from the job's
# OIDC token, so no NPM_TOKEN secret is needed or used. Requires npm >= 11.5.1
# (the runner's bundled npm is older, hence the npm upgrade step).
#
# The dry-run step always runs (tarball + provenance wiring exercised on
# every tag); the real publish additionally requires the repository variable
# PUBLISH_ENABLED == "true" and a tag matching package.json's version.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance (Sigstore) needs an OIDC token

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest # OIDC trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Publish (dry run, always)
        run: npm publish --provenance --access public --dry-run

      - name: Publish
        if: vars.PUBLISH_ENABLED == 'true'
        run: npm publish --provenance --access public
